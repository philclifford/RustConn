[package]
name = "rustconn-pty-sys"
description = "Isolated FFI helper for RustConn's PTY layer: openpty, controlling-terminal setup, TIOCSWINSZ, and raw fd I/O."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["term", "process"] }

# This crate is the single sanctioned location for `unsafe` in the workspace
# (see rust-pragmatic-guidelines.md, M-UNSAFE: isolate FFI in a small -sys
# crate). It therefore does NOT opt into `[workspace.lints]`
# (unsafe_code = "forbid") and instead explicitly allows unsafe here.
[lints.rust]
unsafe_code = "allow"
