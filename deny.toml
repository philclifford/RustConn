# cargo-deny configuration for RustConn
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# cargo-deny v2: vulnerability/unsound/notice fields removed (always error).
# Use `ignore` to suppress specific advisories.
unmaintained = "workspace"
yanked = "warn"
# Transitive dependency advisories with no available fix:
# - RUSTSEC-2023-0071: rsa 0.10.0-rc.18 Marvin Attack (medium 5.9) — no patched
#   version published. Reached only via ironrdp 0.17.0 -> ironrdp-connector
#   0.10.0 -> {picky 7.0.0-rc.25, sspi 0.21.3} -> rsa. Not exploitable in our
#   local-client context: no RSA decryption oracle is exposed.
#   Upgrade path: sspi/picky drop the rsa dependency or rsa ships 0.10 stable.
#   Mirrored in .cargo/audit.toml so cargo-audit and cargo-deny agree.
# Last reviewed: 2026-07-29
# Next review: when ironrdp, sspi, or picky releases a new major version.
#
# - RUSTSEC-2026-0244: gettext-rs 0.7.7 `setlocale` is unsound when called from
#   a multi-threaded program (memory-corruption / thread-safety, informational
#   "unsound"). 0.8.0 fixes it by marking `setlocale` and `TextDomain::init`
#   `unsafe` and documenting when they may be called. RustConn cannot take that
#   version yet: `unsafe_code = "forbid"` in rustconn/Cargo.toml, and the
#   workspace crate-boundary guard rejects unsafe outside `rustconn-*-sys`.
#   Not exploitable as called. `TextDomain::init` is never used. All four
#   `setlocale` calls live in `rustconn/src/i18n.rs` and are reachable only from
#   `i18n::init()` and the private `i18n::apply_language_setlocale()`, both of
#   which are invoked from `main()` before the tracing subscriber, GTK, or any
#   tokio runtime is created — so the process is still single-threaded, which is
#   exactly the precondition the advisory names as safe. 0.19.19 removed the one
#   call site that violated this (`apply_language` from the GTK `activate`
#   handler, where the GIO worker thread is already running) to make the
#   invariant hold and be checkable by reading `main()`.
#   Upgrade path: move the `setlocale` call into a dedicated
#   `rustconn-locale-sys` crate where unsafe is sanctioned, then move to 0.8.
#   Mirrored in .cargo/audit.toml so cargo-audit and cargo-deny agree.
# Last reviewed: 2026-08-09
# Next review: when `rustconn-locale-sys` lands, or if any `setlocale` call site
# appears outside `main()`.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0244",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
