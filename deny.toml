# cargo-deny configuration for RustConn
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# cargo-deny v2: vulnerability/unsound/notice fields removed (always error).
# Use `ignore` to suppress specific advisories.
unmaintained = "workspace"
yanked = "warn"
# Transitive dependency advisories with no available fix:
# - RUSTSEC-2023-0071: rsa 0.10.0-rc.18 Marvin Attack (medium 5.9) — no patched
#   version published. Reached only via ironrdp 0.17.0 -> ironrdp-connector
#   0.10.0 -> {picky 7.0.0-rc.25, sspi 0.21.3} -> rsa. Not exploitable in our
#   local-client context: no RSA decryption oracle is exposed.
#   Upgrade path: sspi/picky drop the rsa dependency or rsa ships 0.10 stable.
#   Mirrored in .cargo/audit.toml so cargo-audit and cargo-deny agree.
# Last reviewed: 2026-07-29
# Next review: when ironrdp, sspi, or picky releases a new major version.
#
# RUSTSEC-2026-0244 (gettext-rs `setlocale` unsound off the main thread) used to
# be ignored here. It was removed from this list when the advisory was actually
# resolved (issue #267), which is why no version is named: it is fixed rather
# than accepted. gettext-rs is on 0.8, where `setlocale` is `unsafe`, and the
# call lives in `rustconn-locale-sys` behind a guard that refuses to run it once
# a second thread exists or once the startup window is sealed. Do not re-add the
# ignore — if this advisory reappears, something regressed.
ignore = [
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
