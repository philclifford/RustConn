name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        RustConn leans toward doing less, well. A request that explains the
        workflow you are trying to finish is much easier to say yes to than one
        that names a widget.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before requesting
      options:
        - label: I searched the existing issues and this is not already requested
          required: true
        - label: I checked the [User Guide](https://github.com/totoshko88/RustConn/blob/main/docs/USER_GUIDE.md) and this does not already exist
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, not the solution. What is awkward or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working. A rough sketch is fine.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - A protocol or client (SSH, RDP, VNC, SPICE, Serial, Kubernetes, Zero Trust, …)
        - Terminal and sessions
        - Connection organization (groups, tags, templates, smart folders)
        - Credentials / secret backends
        - Import / export
        - Cloud sync
        - Automation (expect rules, tasks, broadcast)
        - Networking (jump hosts, tunnels, MPTCP, port knocking)
        - User interface
        - CLI (rustconn-cli)
        - Packaging / distribution
        - Translations
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other tools that solve it, or a workaround you use now

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - label: I am interested in implementing this myself
