name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Mitigate transient crates.io fetch flakes ("[16] Error in the HTTP2
  # framing layer"): force HTTP/1.1 and retry network operations.
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '10'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo check
        run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Guards against Rust-only `\u{...}` escapes in translatable literals.
      # xgettext runs with --language=C and cannot decode them, so the msgid
      # would never match the runtime lookup and the string would silently
      # render untranslated in every locale. No toolchain needed — pure text
      # scan, so this stays a fast job independent of the cargo matrix.
      - name: Check i18n string escapes
        run: ./scripts/check-i18n-escapes.sh

      # Both directions of POTFILES.in rot silently. A stale entry breaks
      # po/update-pot.sh; a missing one means the file's strings are never
      # extracted, so they render untranslated in all 16 locales while every
      # catalogue still reports 100% complete.
      - name: Check POTFILES.in consistency
        run: ./scripts/check-potfiles.sh

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      # Also catches malformed catalogues and format-placeholder mismatches
      # between msgid and msgstr (e.g. a translation that drops a {} argument).
      #
      # Fuzzy entries are the reason this is a gate rather than a report:
      # gettext ignores them and falls back to English, so a fuzzy translation
      # looks identical to a missing one at runtime while --statistics still
      # counts the catalogue as populated. msgmerge also guesses badly — it
      # once rendered "Play on the remote computer" as the German for
      # "Trigger only once, then remove the rule".
      - name: Validate translation catalogues are complete
        run: ./scripts/check-po-complete.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace

      - name: Run CLI tests (full features)
        run: cargo test -p rustconn-cli --features full

  test-core:
    name: Test Core (no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run core tests
        run: cargo test -p rustconn-core --all-features

  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    # Property tests alone run ~5 min (argon2 is slow); cold/restored-cache
    # compilation of rustconn-core --all-features adds several more. 10 min
    # was too tight and canceled the step mid-run despite tests passing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-proptest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run property tests
        run: cargo test -p rustconn-core --all-features --test property_tests

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check MSRV
        run: |
          rustc --version
          cargo check --all-targets

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs all checks (advisories, bans, licenses, sources) per deny.toml.
      # This is the single source of truth for RustSec advisories — the
      # advisory ignore list lives in deny.toml [advisories]. (Replaces the
      # separate cargo-audit job, which duplicated that ignore list.)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
