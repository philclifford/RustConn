[package]
name = "rustconn-locale-sys"
description = "Isolated FFI helper for RustConn's startup locale: a guarded, single-threaded-only wrapper around setlocale(3)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# Package name is gettext-rs, import path is `gettextrs`, so cargo-machete's
# textual scan cannot see it. Used in src/lib.rs (`gettextrs::setlocale`,
# and `pub use gettextrs::LocaleCategory`).
[package.metadata.cargo-machete]
ignored = ["gettext-rs"]

[dependencies]
# `setlocale` is `unsafe` as of 0.8.0 (RUSTSEC-2026-0244). Calling it is this
# crate's entire reason to exist; the safe remainder of the gettext API
# (bindtextdomain, textdomain, gettext, ngettext) is used directly by rustconn.
gettext-rs = { workspace = true }

# Deliberately the only dependency. In particular there is no `libc`: the
# startup guard's thread count is Linux-only, read from /proc/self/task with
# std alone. Implementing it on macOS (proc_pidinfo(PROC_PIDTASKINFO) or
# task_threads) would add libc plus a second unsafe block to the crate whose job
# is to keep the unsafe surface small, and no CI job builds macOS. If that
# tradeoff is ever revisited, update the crate docs ("What is checked, and what
# is not") and the SAFETY comment in `init_locale` in the same change — they
# both state the limitation.

# This crate is one of the sanctioned locations for `unsafe` in the workspace
# (see rust-pragmatic-guidelines.md, M-UNSAFE: isolate FFI in a small -sys
# crate), and it opts into the workspace lint set like every other crate. The
# single exemption it needs is re-opened in src/lib.rs with a crate-level
# `#![expect(unsafe_code, reason = "…")]`, which is possible because the workspace
# sets that lint to `deny` rather than `forbid`. Declaring `[lints.rust]` here
# instead would *replace* the inherited table, losing clippy::pedantic,
# clippy::nursery and clippy::unwrap_used in the one crate that least wants them
# relaxed.
[lints]
workspace = true
